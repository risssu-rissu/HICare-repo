<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280">
  <defs>
    <style>
      .heart { fill: #2B78C5; }
      .ecg { fill: none; stroke: #FFFFFF; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-weight: 800; font-size: 48px; fill: #2B78C5; text-anchor: middle; letter-spacing: 1px; }
    </style>
  </defs>
  
  <!-- Heart Shape -->
  <path class="heart" d="M120 200 C -20 100, 30 -10, 120 50 C 210 -10, 260 100, 120 200 Z" />
  
  <!-- ECG Line -->
  <!-- Flat -> small up -> flat -> deep down -> high up -> deep down -> small up -> flat -->
  <polyline class="ecg" points="30,120 70,120 80,140 95,60 110,160 125,100 135,120 210,120" />
  
  <!-- HiCare Text -->
  <text x="120" y="260" class="text">HiCare</text>
</svg>
